[project]
name = "homedatabase-api"
version = "0.1.0"
description = "Authoritative backend for the HomeDatabase household ledger."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "celery>=5.5.0",
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.9.0",
    "pypdfium2>=5.12.1",
    "python-multipart>=0.0.20",
    "redis>=6.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "webauthn>=2.5,<3",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
]

[project.scripts]
homedatabase-api = "homedatabase_api.main:run"
homedatabase-seed = "homedatabase_api.seed:run"
homedatabase-backup = "homedatabase_api.backup_cli:run"
homedatabase-retention = "homedatabase_api.retention_cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homedatabase_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
